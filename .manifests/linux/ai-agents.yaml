where: os.name == "linux"

depends:
  - linux.packages

actions:
  # ACP adapters that avante.nvim drives for Claude Code and Codex.
  # Pinned on purpose: bump these versions deliberately, not by accident.
  - action: command.run
    command: npm
    args:
      - install
      - -g
      - --prefix
      - "{{ user.home_dir }}/.npm-global"
      - "@agentclientprotocol/claude-agent-acp@0.88.0"
      - "@agentclientprotocol/codex-acp@2.1.1"

  # Global AI and code-analysis CLIs intentionally track their latest releases.
  - action: command.run
    command: npm
    args:
      - install
      - -g
      - --prefix
      - "{{ user.home_dir }}/.npm-global"
      - "@augmentcode/auggie"
      - "@caveman-ai/cli"
      - "@nanonets/graft"
      - "@openai/codex"
