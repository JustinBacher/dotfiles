where: os.name == "linux"

depends:
  - linux.packages

actions:
  # Only sets a default when rustup has none. Leaves an existing default alone.
  - action: command.run
    command: sh
    args:
      - -c
      - "rustup show active-toolchain >/dev/null 2>&1 || rustup default stable"

  # Cargo tools intentionally track their latest published releases.
  - action: command.run
    command: bash
    args:
      - files/install-cargo-tools.sh

  # Fisher treats fish_plugins as the exact desired plugin set.
  - action: command.run
    command: bash
    args:
      - files/manage-fisher-plugins.sh

  # Only does work on NVIDIA machines. Loads the nvidia modules into the
  # initramfs and enables DRM modeset. Calls sudo itself for root steps.
  - action: command.run
    command: bash
    args:
      - files/nvidia-setup.sh

  # Reconciles the Hyprland plugin repositories and enabled plugin state.
  - action: command.run
    command: bash
    args:
      - files/manage-hyprpm-plugins.sh
