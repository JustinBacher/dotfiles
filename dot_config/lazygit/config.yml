    activeBorderColor:
      - "#ffb4a9"
      - bold
    inactiveBorderColor:
      - "#ffb4a9"
    searchingActiveBorderColor:
      - "#f8bc60"
      - bold
    optionsTextColor:
      - "#e0bfba"
    selectedLineBgColor:
      - "#352725"
