min_version = "2026.10.6"
include = ["packages.toml"]

[tools]
node = "latest"
rust = "stable"
"cargo:ast-grep" = "latest"
"cargo:cargo-chef" = "latest"
"cargo:cargo-make" = "latest"
"cargo:cargo-sort" = "latest"
"cargo:cargo-update" = "latest"
"cargo:sqlx-cli" = "latest"
"cargo:unused-pub" = "latest"
"npm:@agentclientprotocol/claude-agent-acp" = "0.88.0"
"npm:@agentclientprotocol/codex-acp" = "2.1.1"
"npm:@augmentcode/auggie" = "latest"
"npm:@caveman-ai/cli" = "latest"
"npm:@nanonets/graft" = "latest"
"npm:@openai/codex" = "latest"

[bootstrap.files."~/.config/fish/fish_plugins"]
source = "./fish_plugins.txt"

[bootstrap.files."/etc/modprobe.d/nvidia.conf"]
content = "options nvidia-drm modeset=1\n"

[bootstrap.mise_shell_activate]
fish = "auto"

[bootstrap.hooks.pre-packages]
run = '''
bash -euo pipefail <<'BASH'
if command -v paru >/dev/null 2>&1; then
    exit 0
fi

# Install build prerequisites through Mise before the normal package pass.
mise bootstrap packages apply --yes pacman:git pacman:base-devel pacman:rustup

if pacman -Si paru >/dev/null 2>&1; then
    mise bootstrap packages apply --yes pacman:paru
    exit 0
fi

rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
build_dir=$(mktemp -d)
trap 'rm -rf "$build_dir"' EXIT
git clone --depth 1 https://aur.archlinux.org/paru.git "$build_dir/paru"
(
    cd "$build_dir/paru"
    makepkg -si --needed --noconfirm
)
BASH
'''


[tasks.bootstrap]
description = "Finish machine setup after packages, files, and tools are installed"
run = [
  { task = "system" },
  { task = "github" },
  { task = "wallpapers" },
]

[tasks.system]
description = "Configure Fisher, NVIDIA initramfs, and Hyprland plugins"
run = [
  { task = "system:fisher" },
  { task = "system:nvidia" },
  { task = "system:hyprpm" },
]


[tasks."system:fisher"]
description = "Reconcile Fisher plugins"
run = '''"${FISH_BIN:-fish}" -c 'fisher update' '''

[tasks."system:nvidia"]
description = "Configure NVIDIA initramfs modules"
run = '''#!/usr/bin/env bash
set -euo pipefail

lspci=${LSPCI_BIN:-lspci}
if ! "$lspci" -k | grep -A2 -E 'VGA|3D' | grep -qi nvidia; then
    echo "no NVIDIA GPU found; skipping"
    exit 0
fi

if ! grep -E '^MODULES=' /etc/mkinitcpio.conf | grep -q nvidia; then
    sudo sed -i '/^MODULES=/ s/)$/ nvidia nvidia_modeset nvidia_uvm nvidia_drm)/' /etc/mkinitcpio.conf
    sudo mkinitcpio -P
fi
'''

[tasks."system:hyprpm"]
description = "Reconcile Hyprland plugins"
run = '''#!/usr/bin/env bash
set -euo pipefail

hyprpm=${HYPRPM_BIN:-hyprpm}
state="$("$hyprpm" list)"

plugin_enabled() {
    local plugin=$1
    local line
    local found=false

    while IFS= read -r line; do
        if [[ $line == *"Plugin $plugin"* ]]; then
            found=true
            continue
        fi

        if [[ $found == true && $line == *"enabled: true"* ]]; then
            return 0
        fi

        if [[ $found == true && ( $line == *"Plugin "* || $line == *"Repository "* ) ]]; then
            return 1
        fi
    done <<<"$state"

    return 1
}

ensure_plugin() {
    local plugin=$1
    local repository=$2

    if [[ $state != *"Plugin $plugin"* ]]; then
        "$hyprpm" add "$repository"
        state="$("$hyprpm" list)"
    fi

    if ! plugin_enabled "$plugin"; then
        "$hyprpm" enable "$plugin"
        state="$("$hyprpm" list)"
    fi
}

ensure_plugin hyprglass https://github.com/hyprnux/hyprglass
ensure_plugin dynamic-cursors https://github.com/VirtCode/hypr-dynamic-cursors
ensure_plugin hyprchromakey https://github.com/TheWoomy27/hyprchromakey
"$hyprpm" update
'''


[tasks.github]
description = "Create and register the GitHub SSH key"
run = '''#!/usr/bin/env fish
set data (keeper get --format=json "SIybz-Gl4FC1qQ9wsG2x1w")
set passphrase (echo $data | jq -r '.custom[] | select(.label == "SSH Passphrase") | .value[0]')
set github_token (echo $data | jq -r '.custom[] | select(.label == "Personal Access Token") | .value[0]')

if test -z "$github_token" -a -z "$passphrase"
    echo "Unable to get login info for github"
    exit 0
end

set ssh_key_path "$HOME/.ssh/id_github"
if test -f "$ssh_key_path"
    echo "SSH key $ssh_key_path already exists; skipping."
    exit 0
end

echo "Generating ssh key for $(hostname)"
ssh-keygen -q -t ed25519 -f $ssh_key_path -N "$passphrase" -C "github@$(hostname)"
ssh-agent
ssh-add $ssh_key_path

curl -Ls \
    -X POST \
    -H "Accept: application/vnd.github+json" \
    -H "Authorization: Bearer $github_token" \
    -H "X-GitHub-Api-Version: 2022-11-28" \
    https://api.github.com/user/keys \
    -d (string join '' '{"title":"' (hostname) '","key":"' (cat $ssh_key_path.pub) '"}')

echo "SSH key added to GitHub successfully"
'''

[tasks.wallpapers]
description = "Download managed wallpapers"
run = '''#!/usr/bin/env bash
set -euo pipefail

url=https://i.imgur.com/l2GXHw0.png
destination=${WALLPAPER_PATH:-"$HOME/Wallpapers/snowy_stairs.png"}
temporary=$(mktemp)
trap 'rm -f "$temporary"' EXIT

wget --quiet --user-agent="Mozilla/5.0" --output-document "$temporary" "$url"
install -Dm644 "$temporary" "$destination"
'''
