[mgr]
show_hidden = true
show_symlink = true
linemode = "size_mtime"

[opener]
edit = [{ run = 'nvim %s', block = true }]
play = [{ run = 'mpv %s', orphan = true, for = "unix" }]
view = [{ run = 'mupdf %s', orphan = true, for = "unix" }]
open = [{ run = 'xdg-open %s', desc = "Open" }]

extract = [{ run = "ouch d %s", block = true, desc = "Extract with Ouch into named subfolder", for = "unix" }]

[open]
prepend_rules = [
    { mime = "application/{*zip,*gzip,tar,bzip*,7z*,rar,xz,zstd,java-archive}", use = "extract" },
    { url = "*.json", use = "edit" },

    # Multiple openers for a single rule
    { url = "*.html", use = ["open", "edit"] },
]
append_rules = [{ url = "*", use = "open" }]

[[plugin.prepend_fetchers]]
url = "local://*"
run = "mime-ext.local"
prio = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url = "remote://*"
run = "mime-ext.remote"
prio = "high"
group = "mime"


[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_previewers]]
mime = "application/{*zip,*gzip,tar,bzip*,7z*,rar,xz,zstd,java-archive}"
run = "ouch --show-file-icons"

[[plugin.prepend_previewers]]
mime = "application/{*executable*,msdownload,x-dosexec,x-msdos-program}"
run = "exiftool"

[[plugin.prepend_previewers]]
url = "*.{md,csv,rst,ipynb,json}"
run = "rich-preview"

[[plugin.prepend_spotters]]
mime = "image/*"
run = "spot-image"
