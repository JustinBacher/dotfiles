
# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█ █▀
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄ ▄█

$MONITOR1=DP-3
$MONITOR2=HDMI-A-1
$MONITOR3=DP-1

# UTM Virt Display name on MacOS
monitor = Virtual-1,3024x1890@120,auto,2
# Desktop PC
monitor = $MONITOR2,1600x900@85,0x0,1
monitor = $MONITOR1,1920x1080@100,700x900,1
monitor = $MONITOR3,1600x900@85,1600x0,1

# Terminals
windowrule {
  name = windowrule-1
  workspace = 1
  match:title = foot
}

windowrule {
  name = windowrule-2
  workspace = 1
  match:title = ghostty
}

windowrule {
  name = windowrule-3
  workspace = 1
  match:title = wezterm
}

windowrule {
  name = windowrule-4
  workspace = 1
  match:title = kitty
}


# Browsers
windowrule {
  name = windowrule-5
  workspace = 2
  match:title = zen
}

windowrule {
  name = windowrule-6
  workspace = 2
  match:title = firefox
}

windowrule {
  name = windowrule-7
  workspace = 2
  match:title = chromium
}


# Games
windowrule {
  name = windowrule-8
  workspace = 3
  match:title = gog galaxy
}

windowrule {
  name = windowrule-9
  workspace = 3
  match:title = ubisoft connect
}

windowrule {
  name = windowrule-10
  workspace = 3
  match:title = origin
}

windowrule {
  name = windowrule-11
  workspace = 3
  match:title = epic games
}

windowrule {
  name = windowrule-12
  workspace = 3
  match:title = wine
}

windowrule {
  name = windowrule-13
  workspace = 3
  match:title = steam
}

windowrule {
  name = windowrule-14
  workspace = 3
  match:title = overwatch
}

windowrule {
  name = windowrule-15
  workspace = 3
  match:title = wine system tray
}

windowrule {
  name = windowrule-16
  workspace = 3
  match:title = battle.net
}

windowrule {
  name = windowrule-17
  workspace = 3
  match:title = blizzard
}

windowrule {
  name = windowrule-18
  workspace = 3
  match:title = lutris
}


# Social
windowrule {
  name = windowrule-19
  workspace = 4
  match:title = discord
}

windowrule {
  name = windowrule-20
  workspace = 4
  match:title = vesktop
}


# Media
windowrule {
  name = windowrule-21
  workspace = 5
  match:title = spotify
}


# Set workspaces to specific monitors  
workspace = 1, monitor:$MONITOR1  # Terminals  
workspace = 3, monitor:$MONITOR1 # Games  
workspace = 2, monitor:$MONITOR2  # Browsers  
workspace = 4, monitor:$MONITOR3 # Misc  
workspace = 5, monitor:$MONITOR3 # Social  
workspace = 6, monitor:$MONITOR3 # General  
workspace = 7, monitor:$MONITOR3 # General  
workspace = 8, monitor:$MONITOR3 # General  
workspace = 9, monitor:$MONITOR3 # General  
workspace = 10, monitor:DP$MONITOR3 # General  
