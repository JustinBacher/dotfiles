layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = rofi
}

layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  match:namespace = anyrun
}

layerrule {
  name = layerrule-3
  blur = on
  match:namespace = gbar
}

layerrule {
  name = layerrule-4
  blur = on
  match:namespace = logout_dialog
}


# swaync blurring
layerrule {
  name = layerrule-5
  blur = on
  ignore_alpha = 0.7
  xray = on
  blur_popups = on
  match:namespace = swaync-control-center
}

layerrule {
  name = layerrule-6
  blur = on
  ignore_alpha = 0.7
  match:namespace = swaync-notification-window
}

