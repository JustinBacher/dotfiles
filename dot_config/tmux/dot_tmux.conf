unbind r
bind r source-file ~/.tmux.conf
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g prefix C-Space
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-L select-window -n
bind -n M-H select-window -p
bind -n M-N new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-h split-window -hb -c "#{pane_current_path}"
bind -n M-j split-window -c "#{pane_current_path}"
bind -n M-k split-window -vb -c "#{pane_current_path}"
bind -n M-l split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind b break-pane -d

bind -n C-M-h resize-pane -L 30
bind -n C-M-j resize-pane -D 15
bind -n C-M-k resize-pane -U 15
bind -n C-M-l resize-pane -R 30

bind s display-popup -E -w 80% -h 80% "sesh connect \"\$(sesh list | fzf --prompt='session: ')\""

set -g base-index 1
setw -g pane-base-index 1

set-option -a terminal-features "xterm-ghostty:RGB"

set -g extended-keys-format csi-u

# Yazi previewer settings
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g status-bg default
set-option -g status-position top
set-option -g status-style bg=default
set-option -g focus-events on
setw -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Keep Continuum last so themes cannot overwrite its autosave hook.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore the last saved workspace when the tmux server starts after a reboot.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Themeing
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_wbg 1
set -g @tokyo-night-tmux_theme "moon"
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style digital
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_netspeed_iface "wlan0"

# Support for undercurls
set -g default-terminal "$TERM"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

run '~/.config/tmux/plugins/tpm/tpm'
