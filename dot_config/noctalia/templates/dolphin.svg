<svg xmlns="http://www.w3.org/2000/svg" width="160" height="550" viewBox="0 0 160 550">
  <rect id="window-normal" x="0" y="0" width="100" height="100" fill="{{ colors.surface_container_lowest.default.hex }}" fill-opacity="0.72"/>
  <rect id="selection-normal" x="0" y="110" width="100" height="28" fill="none"/>
  <rect id="selection-focused" x="0" y="150" width="100" height="28" rx="5" fill="{{ colors.surface_container_lowest.default.hex }}" fill-opacity="0.50"/>
  <rect id="selection-pressed" x="0" y="190" width="100" height="28" rx="5" fill="{{ colors.primary.default.hex }}"/>
  <rect id="selection-toggled" x="0" y="230" width="100" height="28" rx="5" fill="{{ colors.primary.default.hex }}"/>
  <rect id="header-normal" x="0" y="270" width="100" height="28" fill="{{ colors.surface_container.default.hex }}" fill-opacity="0.35"/>
  <rect id="header-focused" x="0" y="310" width="100" height="28" fill="{{ colors.primary.default.hex }}" fill-opacity="0.10"/>
  <rect id="header-pressed" x="0" y="350" width="100" height="28" fill="{{ colors.primary.default.hex }}" fill-opacity="0.18"/>
  <rect id="scrollthumb-normal" x="110" y="0" width="6" height="24" rx="3" fill="{{ colors.on_surface_variant.default.hex }}" fill-opacity="0.55"/>
  <rect id="scrollthumb-focused" x="120" y="0" width="6" height="24" rx="3" fill="{{ colors.primary.default.hex }}" fill-opacity="0.85"/>
  <rect id="scrollthumb-pressed" x="130" y="0" width="6" height="24" rx="3" fill="{{ colors.primary.default.hex }}"/>
  <rect id="header-separator" x="140" y="0" width="1" height="28" fill="none"/>
  <rect id="control-normal" x="0" y="390" width="100" height="28" rx="5" fill="{{ colors.surface_container_lowest.default.hex }}" fill-opacity="0.40"/>
  <rect id="control-focused" x="0" y="430" width="100" height="28" rx="5" fill="{{ colors.surface_container_lowest.default.hex }}" fill-opacity="0.60"/>
  <rect id="control-pressed" x="0" y="470" width="100" height="28" rx="5" fill="{{ colors.primary.default.hex }}"/>
  <rect id="control-toggled" x="0" y="510" width="100" height="28" rx="5" fill="{{ colors.primary.default.hex }}"/>
</svg>
